name: Dashboard Update

# Fusion Communications fork of Mailflare.
# The "Update Mailflare" button in the admin dashboard runs this workflow.
# Unlike the original (which REPLACED this repository with upstream and
# removed our changes), this version MERGES upstream into our branch, so our
# customizations (the Team unlock) are kept. If the merge conflicts with our
# changes, nothing is pushed or deployed and the live site keeps running.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailflare-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPDATE_SOURCE_REPOSITORY: ${{ vars.UPDATE_SOURCE_REPOSITORY || 'hieunc229/mailflare' }}

    steps:
      - name: Check required secrets
        env:
          UPDATE_TOKEN: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -z "${UPDATE_TOKEN}" ] && echo "::error::Add MAILFLARE_UPDATE_TOKEN as a repository Actions secret." && missing=1
          [ -z "${CF_API}" ] && echo "::error::Add CLOUDFLARE_API_TOKEN as a repository Actions secret." && missing=1
          [ -z "${CF_ACCOUNT}" ] && echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a repository Actions secret." && missing=1
          exit $missing

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}

      - name: Merge upstream into our branch (keeps our changes)
        run: |
          set -euo pipefail
          git config user.name "mailflare-update"
          git config user.email "mailflare-update@users.noreply.github.com"

          upstream_url="https://github.com/${UPDATE_SOURCE_REPOSITORY}.git"
          git remote add upstream "${upstream_url}" 2>/dev/null || git remote set-url upstream "${upstream_url}"
          git fetch --no-tags upstream

          upstream_branch="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          upstream_ref="upstream/${upstream_branch}"

          if git merge-base --is-ancestor "${upstream_ref}" HEAD; then
            echo "Already up to date with ${upstream_ref}."
            echo "UP_TO_DATE=1" >> "$GITHUB_ENV"
            exit 0
          fi

          before="$(git rev-parse HEAD)"
          git merge --no-ff --no-commit "${upstream_ref}" || true

          # Always keep OUR version of this workflow, never upstream's.
          git checkout "${before}" -- .github/workflows/deploy-update.yml

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "${conflicts}" ]; then
            echo "::error::Upstream changes conflict with our customizations in:"
            echo "${conflicts}"
            echo "::error::Nothing was changed. Ask for a manual update."
            git merge --abort
            exit 1
          fi

          git commit -m "Merge ${UPDATE_SOURCE_REPOSITORY}@${upstream_branch} into ${GITHUB_REF_NAME}"

      - name: Verify our Team unlock is still in place
        if: env.UP_TO_DATE != '1'
        run: |
          if ! grep -q 'plan: "team"' src/lib/licenses/service.ts; then
            echo "::error::After merging, the Team unlock in src/lib/licenses/service.ts is gone (upstream changed that code)."
            echo "::error::Nothing was pushed or deployed. Ask for a manual update."
            exit 1
          fi

      - name: Set up Node
        if: env.UP_TO_DATE != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        if: env.UP_TO_DATE != '1'
        env:
          NODE_ENV: development
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build

      - name: Deploy to Cloudflare
        if: env.UP_TO_DATE != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Save the merged version to GitHub
        if: env.UP_TO_DATE != '1'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
